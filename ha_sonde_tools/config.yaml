name: Sonde Tools
slug: ha_sonde_tools
version: "0.12.6"
description: Radiosonde tracking, flight history, recovery tools, and Telegram alerts (v0.12.6)
arch: [amd64, aarch64]
startup: application
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_title: Sonde Tools
panel_icon: mdi:map-marker-radius
options:
  zone: zone.home
  radius_km: 30
  archive_radius_km: 0
  telegram_entity: ""
  timezone: Europe/Budapest
  startup_test: false
  debug: false
  dashboard_sensor: false
  health_alerts: true
  dnd_enabled: false
  dnd_from: "22:00"
  dnd_to: "07:00"
schema:
  zone: str
  radius_km: float(0.1,500)
  archive_radius_km: float(0,500)
  telegram_entity: str
  ground_elevation_m: float(-400,9000)?
  timezone: str
  startup_test: bool
  debug: bool
  dashboard_sensor: bool
  health_alerts: bool
  dnd_enabled: bool
  dnd_from: str
  dnd_to: str
  map_default_basemap: bool?
  map_tile_url: str?
  map_tile_attribution: str?
