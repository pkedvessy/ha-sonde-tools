name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: for file in ha_sonde_tools/web/*.js; do node --check "$file"; done

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build the app image
        run: docker buildx build --platform ${{ matrix.platform }} ha_sonde_tools
      - name: Smoke-test imports
        if: matrix.platform == 'linux/amd64'
        run: |
          docker buildx build --load -t sonde-tools-ci ha_sonde_tools
          docker run --rm sonde-tools-ci python -c "import notifier, map_image, dashboard, maintenance; print('imports ok')"
